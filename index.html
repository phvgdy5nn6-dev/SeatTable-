const pages=[...document.querySelectorAll('.page')];let cur=0;function show(n){cur=n;pages.forEach((p,i)=>p.classList.toggle('active',i===n));window.scrollTo(0,0)}
show(0);
// intro -> seat map: whole lower half / tap prompt area
const intro=document.createElement('button');intro.className='hot';intro.style='left:35%;top:55%;width:40%;height:30%';intro.onclick=()=>show(1);pages[0].appendChild(intro);
// seat map card buttons; tap anywhere on a card to open its linked message. These correspond to the existing PowerPoint links.
const seats=[
[0,27,25,32,3],[25.8,27,25,32,4],[51.5,27,25,32,5],[76.5,27,23.5,32,6],
[25.8,73,25,24,7],[51.5,73,25,24,8],[76.5,73,23.5,24,9]
];seats.forEach(([x,y,w,h,d])=>{let b=document.createElement('button');b.className='hot';b.style=`left:${x}%;top:${y}%;width:${w}%;height:${h}%`;b.onclick=()=>show(d);pages[1].appendChild(b)});
// message pages: SeatMap button area returns to seat map
for(let i=3;i<11;i++){let b=document.createElement('button');b.className='hot';b.style='left:43%;bottom:0%;width:23%;height:9%';b.onclick=()=>show(1);pages[i].appendChild(b)}
// closing page can return to seat map by tapping anywhere near bottom
let b=document.createElement('button');b.className='hot';b.style='left:25%;top:65%;width:55%;height:25%';b.onclick=()=>show(1);pages[2].appendChild(b);
